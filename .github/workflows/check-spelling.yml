# Spell checking via crate-ci/typos.
#
# Replaces check-spelling/check-spelling@v0.0.26, retired after the upstream
# maintainer-account compromise of 2026-06-16 (that action self-aborts through a
# remote kill-switch). typos is a self-contained, corrections-based checker;
# its config lives in /typos.toml. The third-party action is SHA-pinned.
name: Spell checking

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  spelling:
    name: Spell checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2
