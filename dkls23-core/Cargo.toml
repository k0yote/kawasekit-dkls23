[package]
name = "dkls23-core"
version = "0.5.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "DKLs23 Threshold ECDSA — curve-generic core"
repository = "https://github.com/k0yote/kawasekit-dkls23"
readme = "README.md"
# Deliberately un-publishable: this fork keeps the upstream crate names and is consumed only
# by pinned git rev (README "How it's consumed").
publish = false

[dependencies]
elliptic-curve = { version = "0.14.0-rc.4", features = ["arithmetic", "sec1"] }
rustcrypto-ff = "0.14.0-rc.0"
rustcrypto-group = "0.14.0-rc.0"
k256 = { version = "0.14.0-rc.7" }
sha2 = "0.11.0-rc.5"
hmac = "0.13.0-rc.5"
ripemd = "0.2.0-rc.5"
rand = "0.10"
hex = "0.4"
bincode = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.12", optional = true }
zeroize = { version = "1", features = ["derive"] }
subtle = "2.6.1"
itertools = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[dev-dependencies]
serde_json = "1"
proptest = "1"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_bytes", "dep:bincode", "k256/serde"]
insecure-rng = []
# C1 (self-audit): `re_key` is a trusted-dealer single-secret keygen — one host briefly holds
# the WHOLE key. Gated OFF by default so it is unreachable in a production build. Enable ONLY
# for an explicit "import an already-single-custody key" use case; keys made this way have NO
# distributed-trust guarantee. Tests reach it implicitly via `cfg(test)`, no feature needed.
trusted-dealer-import = []
